name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install blog builder
        run: python -m pip install "Markdown==3.9" "bleach==6.2.0" "Pillow==11.3.0" "numpy==2.3.4" "scipy==1.16.2" "PyMuPDF==1.26.4" "reportlab==4.4.4"
      - name: Generate blog and check JavaScript
        run: |
          python scripts/build_blog.py
          python scripts/contrast_favicon.py
          python scripts/generate_quiz_gifs.py
          python scripts/build_cv.py
          python scripts/fetch_pdf_beauty.py
          python scripts/enrich_gifts.py
          python scripts/inspect_gifts.py
          node --check assets/js/site.js
          node --check assets/js/experience.js
          node --check assets/js/v3.js
          node --check assets/js/v4.js
          node --check assets/js/v17.js
          node --check assets/js/v18.js
      - name: Version generated animated icons and downloadable professional CVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!blog/index.html' ':!blog/**/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "build(ux): publish 4 quiz animations and 2 Rosela CVs [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
